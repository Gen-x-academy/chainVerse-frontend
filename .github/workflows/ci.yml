name: Frontend CI
on: [push, pull_request]
jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          {
            node-version: 20,
            cache: "npm",
            cache-dependency-path: frontend-v2/package-lock.json,
          }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: Enforce scholarship import boundaries
        # Test-only fixtures and operator load-testing tooling must stay out of
        # the shipped route graph (issues #1224, #1225).
        run: npm run check:production-imports
      - run: npm run build
      - run: npm test
      - name: Run scholarship security abuse suite
        run: npm run test:security
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3002

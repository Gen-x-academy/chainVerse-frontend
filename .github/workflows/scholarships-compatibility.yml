name: Scholarships Compatibility Gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run compatibility gate
        run: npx vitest run test/scholarships/compatibility-gate.test.ts
      - name: Run documentation gate
        run: npx vitest run test/scholarships/documentation-gate.test.ts
      - name: Run seed flow gate
        run: npx vitest run test/scholarships/seed.test.ts
      - name: Run release readiness gate
        run: npx vitest run test/scholarships/release.test.ts